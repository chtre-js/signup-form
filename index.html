<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
    <title>Login or Sign-up</title>
</head>
<body>
    <div class="main">
        <div class="branding-side_wrap">
            <p class="picture-credits">&copy; Simon Lee on <a href="https://www.unsplash.com">unsplash.com</a> </p>
        </div>
        <div class="content_wrap">
            <div class="form_container">
                <div class="form_header">
                    <h1>Claim your space.</h1>
                    <p>Step into a faster, cleaner workflow. Create your account in seconds.</p>
                    <span class="required-legend"><span class="asterisk">*</span> Required fields</span>
                </div>
                <div class="form_wrap">
                    <form>
                        <div>
                            <div>
                                <label for="first_name">First name</label>
                                <input required type="text" id="first_name" name="first_name" placeholder="John">
                            </div>
                            <div>
                                <label for="last_name">Last name</label>
                                <input required type="text" id="last_name" name="last_name" placeholder="Doe">
                            </div>
                        </div>
                        <div>
                            <div>
                                <label for="email">Email</label>
                                <input required type="email" id="email" name="email" placeholder="name@example.com">
                            </div>
                            <div>
                                <label for="phone">Phone Number</label>
                                <input required type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" minlength="10">
                            </div>
                        </div>
                        <div>
                            <div>
                                <label for="password">Enter a new password</label>
                                <input required type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8">
                            </div>
                            <div>
                                <label for="confirm_password">Confirm password</label>
                                <input required type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" minlength="8">
                            </div>
                        </div>
                        <button class="submit-btn">Create Account</button>
                    </form>
                </div>
                <div class="signup_wrap">
                    <p>Already have an account ? <a href="#" rel="noreferrer">Sign In</a></p>
                </div>
            </div>
            <div class="footer_links_wrap"></div>
        </div>
    </div>
</body>
</html>
