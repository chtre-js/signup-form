<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
    <title>Login or Sign-up</title>
</head>
<body>
    <div class="main">
        <div class="branding-side_wrap"></div>
        <div class="content_wrap">
            <div class="form_container">
                <div class="form_header">
                    <h1>Claim your space.</h1>
                    <p>Step into a faster, cleaner workflow. Create your account in seconds.</p>
                </div>
                <div class="form_wrap">
                    <form>
                        <div>
                            <div>
                                <label>First name</label>
                                <input required type="text" placeholder="John">
                            </div>
                            <div>
                                <label>Last name</label>
                                <input required type="text" placeholder="Doe">
                            </div>
                        </div>
                        <div>
                            <div>
                                <label>Email</label>
                                <input required type="email" placeholder="name@example.com">
                            </div>
                            <div>
                                <label>Phone Number</label>
                                <input required type="tel" placeholder="+1 (555) 000-0000" pattern="(\+?\d{1,3}[- ]?)?\(?[0-9]{3}\)?[-. ]?[0-9]{3}[-. ]?[0-9]{4}">
                            </div>
                        </div>
                        <div>
                            <div>
                                <label>Enter a new password</label>
                                <input required type="password" placeholder="At least 8 characters" minlength="8">
                            </div>
                            <div>
                                <label>Confirm password</label>
                                <input required type="password" placeholder="Re-enter your password" minlength="8">
                            </div>
                        </div>
                        <button class="submit-btn">Create Account</button>
                    </form>
                </div>
                <div class="signup_wrap">
                    <p>Already have an account ? <a href="#" rel="noreferrer">Sign In</a></p>
                </div>
            </div>
            <div class="footer_links_wrap"></div>
        </div>
    </div>
</body>
</html>
